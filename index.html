<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>彼岸花海 · 手动种花</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: Arial, sans-serif; }
        #blessing-modal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            opacity: 0;
            transition: opacity 1s ease;
            pointer-events: none;
        }
        #blessing-modal.show {
            opacity: 1;
            pointer-events: auto;
        }
        #blessing-modal .box {
            background: linear-gradient(145deg, #ffb6c1, #ff69b4);
            padding: 40px 60px;
            border-radius: 60px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(255, 20, 80, 0.6);
            color: white;
            font-size: 28px;
            line-height: 1.8;
            font-weight: bold;
            text-shadow: 0 4px 20px rgba(0,0,0,0.3);
            border: 2px solid rgba(255,255,255,0.4);
            max-width: 90%;
            transform: scale(0.8);
            transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        #blessing-modal.show .box {
            transform: scale(1);
        }
        #blessing-modal .box small {
            display: block;
            margin-top: 20px;
            font-size: 18px;
            opacity: 0.9;
            font-weight: normal;
        }
        #blessing-modal .box .flower-icon {
            font-size: 60px;
            margin-bottom: 10px;
        }
        #info {
            position: absolute; top: 20px; left: 0; width: 100%; text-align: center;
            color: rgba(255, 255, 255, 0.9);
            text-shadow: 0 2px 20px rgba(0,0,0,0.5);
            pointer-events: none; z-index: 20; font-size: 15px;
        }
        #info span {
            background: rgba(200, 50, 100, 0.5);
            padding: 8px 28px;
            border-radius: 40px;
            backdrop-filter: blur(6px);
            border: 1px solid rgba(255,255,255,0.2);
            display: inline-block;
        }
        #debug {
            position: absolute; bottom: 30px; left: 20px;
            color: #ffd1dc; background: rgba(0,0,0,0.5);
            padding: 10px 18px; border-radius: 8px;
            font-family: monospace; font-size: 14px;
            pointer-events: none; z-index: 30;
            max-width: 320px; white-space: pre-wrap;
            backdrop-filter: blur(4px);
        }
        #camera-preview {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 160px;
            height: 120px;
            border-radius: 12px;
            border: 2px solid rgba(255,255,255,0.3);
            overflow: hidden;
            z-index: 40;
            box-shadow: 0 4px 30px rgba(0,0,0,0.5);
            background: #000;
            transform: scaleX(-1);
        }
        #camera-preview video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        @media (max-width: 600px) {
            #camera-preview { width: 100px; height: 75px; top: 10px; right: 10px; }
        }
        #loading {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #1a0a0a; display: flex; justify-content: center; align-items: center;
            color: #ffb6c1; font-size: 24px; z-index: 100;
            font-family: sans-serif; flex-direction: column;
        }
        #loading .spinner {
            border: 6px solid #3a1a1a; border-top: 6px solid #ff69b4;
            border-radius: 50%; width: 60px; height: 60px;
            animation: spin 1s linear infinite; margin-bottom: 20px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        #cam-btn {
            position: absolute;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 50;
            background: rgba(255,255,255,0.15);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.3);
            color: white;
            padding: 12px 30px;
            border-radius: 40px;
            font-size: 18px;
            cursor: pointer;
            transition: 0.3s;
            letter-spacing: 1px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }
        #cam-btn:hover { background: rgba(255,255,255,0.25); transform: translateX(-50%) scale(1.05); }
        #cam-btn:active { transform: translateX(-50%) scale(0.95); }
    </style>
</head>
<body>
    <div id="loading">
        <div class="spinner"></div>
        <div>🌺 彼岸花海加载中...</div>
    </div>

    <div id="blessing-modal">
        <div class="box">
            <div class="flower-icon">🌸</div>
            祝我亲爱的朋友们，<br>
            每天开开心心，快快乐乐，<br>
            彼岸花海送给你们 🌺
            <small>— 来自你的花园</small>
        </div>
    </div>

    <div id="info"><span>🖱️ 按住鼠标拖动 · 或张开手掌滑动 · 种下彼岸花</span></div>
    <div id="debug">⏳ 初始化中...</div>
    <div id="camera-preview"><video id="preview-video" autoplay playsinline></video></div>
    <button id="cam-btn">📷 开启摄像头</button>

    <!-- MediaPipe -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous">
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous">
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous">
    </script>

    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
        import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

        // --- DOM 元素 ---
        const loadingEl = document.getElementById('loading');
        const debugEl = document.getElementById('debug');
        const blessingModal = document.getElementById('blessing-modal');
        const previewVideo = document.getElementById('preview-video');
        const camBtn = document.getElementById('cam-btn');

        // --- 场景：粉红色调 ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xffb6c1);
        scene.fog = new THREE.FogExp2(0xffb6c1, 0.025);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(0, 3.5, 8);
        camera.lookAt(0, 0.2, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;
        document.body.prepend(renderer.domElement);

        // --- 特效：Bloom 增强红色辉光 ---
        const composer = new EffectComposer(renderer);
        composer.addPass(new RenderPass(scene, camera));
        const bloomPass = new UnrealBloomPass(
            new THREE.Vector2(window.innerWidth, window.innerHeight),
            0.6, 0.3, 0.1
        );
        composer.addPass(bloomPass);
        composer.addPass(new OutputPass());

        // --- 光照：暖粉色 ---
        scene.add(new THREE.HemisphereLight(0xffb6c1, 0x3a1a2a, 0.8));
        const sun = new THREE.DirectionalLight(0xffaa99, 2.5);
        sun.position.set(8, 12, -4);
        sun.castShadow = true;
        sun.shadow.mapSize.width = 1024;
        sun.shadow.mapSize.height = 1024;
        sun.shadow.camera.near = 0.5;
        sun.shadow.camera.far = 30;
        sun.shadow.camera.left = -12;
        sun.shadow.camera.right = 12;
        sun.shadow.camera.top = 12;
        sun.shadow.camera.bottom = -12;
        scene.add(sun);
        scene.add(new THREE.DirectionalLight(0xcc88aa, 0.5).position.set(-4, 2, 6));

        // --- 地面：粉绿色 ---
        const groundBase = new THREE.Mesh(
            new THREE.PlaneGeometry(30, 30),
            new THREE.MeshStandardMaterial({
                color: 0x8fbc8f,
                roughness: 0.9,
                metalness: 0.0,
                side: THREE.DoubleSide
            })
        );
        groundBase.rotation.x = -Math.PI / 2;
        groundBase.position.y = -0.02;
        groundBase.receiveShadow = true;
        scene.add(groundBase);

        // --- 草：粉绿色调 ---
        const grassGroup = new THREE.Group();
        const grassCount = 3000;
        const grassColors = [0x8fbc8f, 0x9acd9a, 0x7ccd7c, 0x6b8e6b, 0x9fbf9f];
        const geo = new THREE.PlaneGeometry(0.025, 0.3);

        for (let i = 0; i < grassCount; i++) {
            const mat = new THREE.MeshStandardMaterial({
                color: grassColors[Math.floor(Math.random() * grassColors.length)],
                roughness: 0.9,
                metalness: 0.0,
                side: THREE.DoubleSide,
                transparent: true,
                opacity: 0.85
            });
            const blade = new THREE.Mesh(geo, mat);
            const radius = Math.random() * 6.5;
            const angle = Math.random() * Math.PI * 2;
            blade.position.x = Math.cos(angle) * radius;
            blade.position.z = Math.sin(angle) * radius;
            blade.rotation.y = Math.random() * Math.PI * 2;
            blade.userData.baseRotX = (Math.random() - 0.5) * 0.4;
            blade.userData.baseRotZ = (Math.random() - 0.5) * 0.3;
            blade.rotation.x = blade.userData.baseRotX;
            blade.rotation.z = blade.userData.baseRotZ;
            const sy = 0.6 + Math.random() * 1.5;
            blade.scale.set(1, sy, 1);
            blade.castShadow = true;
            blade.receiveShadow = true;
            blade.position.y = -0.1;
            grassGroup.add(blade);
        }
        scene.add(grassGroup);

        // 草生长动画（一次性）
        (function growGrass() {
            const start = performance.now();
            const dur = 1500;
            function grow() {
                let p = (performance.now() - start) / dur;
                if (p > 1) p = 1;
                const ease = 1 - Math.pow(1 - p, 2);
                grassGroup.children.forEach((b, idx) => {
                    const delay = (idx % 30) / 30 * 0.2;
                    const pp = Math.max(0, (ease - delay) / (1 - delay));
                    if (pp > 0) b.position.y = -0.1 + pp * 0.12;
                });
                if (p < 1) requestAnimationFrame(grow);
            }
            grow();
        })();

        // --- 云朵：浅粉色 ---
        function makeCloud(x, y, z, s = 1) {
            const g = new THREE.Group();
            const mat = new THREE.MeshStandardMaterial({
                color: 0xffd1dc,
                transparent: true,
                opacity: 0.3,
                roughness: 0.1,
                depthWrite: false
            });
            const p1 = new THREE.Mesh(new THREE.SphereGeometry(0.8, 7, 7), mat);
            p1.scale.y = 0.4;
            const p2 = new THREE.Mesh(new THREE.SphereGeometry(0.6, 7, 7), mat);
            p2.scale.y = 0.35;
            p2.position.set(0.9, 0.1, 0.2);
            const p3 = new THREE.Mesh(new THREE.SphereGeometry(0.7, 7, 7), mat);
            p3.scale.y = 0.4;
            p3.position.set(-0.9, 0.0, -0.1);
            const p4 = new THREE.Mesh(new THREE.SphereGeometry(0.5, 7, 7), mat);
            p4.scale.y = 0.3;
            p4.position.set(0.5, -0.2, 0.8);
            const p5 = new THREE.Mesh(new THREE.SphereGeometry(0.5, 7, 7), mat);
            p5.scale.y = 0.3;
            p5.position.set(-0.5, -0.1, -0.8);
            g.add(p1, p2, p3, p4, p5);
            g.position.set(x, y, z);
            g.scale.set(s, s * 0.6, s);
            return g;
        }
        scene.add(makeCloud(-5, 5, -7, 2.0));
        scene.add(makeCloud(4, 6, -9, 2.5));
        scene.add(makeCloud(7, 4, -5, 1.6));
        scene.add(makeCloud(-6, 3.5, 6, 1.8));
        scene.add(makeCloud(-8, 1.2, -12, 3.5));
        scene.add(makeCloud(0, 1.5, -14, 4.0));
        scene.add(makeCloud(8, 1.0, -11, 3.0));
        scene.add(makeCloud(-4, 1.8, -15, 3.8));
        scene.add(makeCloud(5, 1.3, -13, 3.2));

        // --- 彼岸花模型加载 (直接使用gltf.scene，不克隆不重组) ---
        const loader = new GLTFLoader();
        let flowerTemplate = null;
        let modelLoaded = false;
        const flowers = [];
        const MAX_FLOWERS = 300;

        loader.load(
            './flower.glb',
            (gltf) => {
                flowerTemplate = gltf.scene;
                // 将花朵整体尺寸缩小到 0.007
                flowerTemplate.scale.set(0.007, 0.007, 0.007);
                flowerTemplate.traverse((child) => {
                    if (child.isMesh) {
                        if (Array.isArray(child.material)) {
                            child.material.forEach(mat => mat.wireframe = false);
                        } else {
                            child.material.wireframe = false;
                        }
                        child.castShadow = false;
                        child.receiveShadow = true;
                    }
                });
                modelLoaded = true;
                console.log("✅ 彼岸花加载成功");
                debugEl.innerText = '✅ 模型已加载，请拖动鼠标或挥手种花';
                loadingEl.style.display = 'none';

                blessingModal.classList.add('show');
                setTimeout(() => {
                    blessingModal.classList.remove('show');
                }, 5000);
            },
            undefined,
            (error) => {
                console.error('❌ 模型加载失败', error);
                const fallbackGroup = new THREE.Group();
                const stem = new THREE.Mesh(new THREE.CylinderGeometry(0.008, 0.012, 0.08), new THREE.MeshStandardMaterial({ color: 0x2a5a2a }));
                stem.position.y = 0.04;
                const head = new THREE.Mesh(new THREE.ConeGeometry(0.04, 0.07, 6), new THREE.MeshStandardMaterial({ color: 0xff3366, emissive: 0x550000 }));
                head.position.y = 0.09;
                fallbackGroup.add(stem);
                fallbackGroup.add(head);
                flowerTemplate = fallbackGroup;
                modelLoaded = true;
                debugEl.innerText = '⚠️ 使用备用花朵';
                loadingEl.style.display = 'none';
                blessingModal.classList.add('show');
                setTimeout(() => {
                    blessingModal.classList.remove('show');
                }, 5000);
            }
        );

        // --- 种花函数（手动触发，带防闪烁） ---
        let lastPlantTime = 0;
        const plantCooldown = 100; // 毫秒

        function plantFlowerAt(position) {
            if (!flowerTemplate || !modelLoaded) return;
            const now = performance.now();
            if (now - lastPlantTime < plantCooldown) return;
            lastPlantTime = now;

            if (flowers.length >= MAX_FLOWERS) {
                const oldest = flowers.shift();
                if (oldest) {
                    scene.remove(oldest);
                    oldest.traverse((child) => {
                        if (child.isMesh) {
                            child.geometry && child.geometry.dispose();
                            child.material && (Array.isArray(child.material) ? child.material.forEach(m => m.dispose()) : child.material.dispose());
                        }
                    });
                }
            }

            const f = flowerTemplate.clone(true);
            f.traverse((child) => {
                if (child.isMesh) {
                    if (Array.isArray(child.material)) {
                        child.material.forEach(mat => mat.wireframe = false);
                    } else {
                        child.material.wireframe = false;
                    }
                    child.castShadow = false;
                    child.receiveShadow = true;
                }
            });

            // 先隐藏，避免闪烁
            f.visible = false;
            f.position.copy(position);
            f.rotation.y = Math.random() * Math.PI * 2;
            const rs = 0.7 + Math.random() * 0.6;
            const baseScale = 0.007 * rs; // 与模型缩放一致
            f.scale.set(baseScale, 0, baseScale);
            f.userData = {
                phase: Math.random() * Math.PI * 2,
                speed: 1 + Math.random() * 0.8,
            };
            scene.add(f);
            flowers.push(f);

            // 生长动画：在动画的第一帧设为可见
            const st = performance.now();
            const duration = 600 + Math.random() * 300;
            (function grow() {
                const now = performance.now();
                let p = (now - st) / duration;
                if (p > 1) p = 1;
                const ease = 1 - Math.pow(1 - p, 3);
                f.scale.y = ease * baseScale;
                f.scale.x = baseScale;
                f.scale.z = baseScale;
                f.position.y = -0.02 + ease * 0.04;
                if (p === 0) {
                    f.visible = true; // 首帧显示
                }
                if (p < 1) {
                    requestAnimationFrame(grow);
                } else {
                    f.position.y = 0.02;
                    f.scale.set(baseScale, baseScale, baseScale);
                    f.visible = true;
                }
            })();

            // 涟漪（柔和）
            const ring = new THREE.Mesh(
                new THREE.RingGeometry(0.015, 0.04, 24),
                new THREE.MeshBasicMaterial({
                    color: 0xffaacc,
                    transparent: true,
                    opacity: 0.3,
                    side: THREE.DoubleSide,
                    depthWrite: false
                })
            );
            ring.position.copy(position);
            ring.position.y = 0.005;
            ring.rotation.x = -Math.PI / 2;
            scene.add(ring);
            const st2 = performance.now();
            (function anim() {
                let p = (performance.now() - st2) / 700;
                if (p > 1) { scene.remove(ring);
                    ring.geometry.dispose();
                    ring.material.dispose(); return; }
                const s = 1 + p * 4;
                ring.scale.set(s, s, s);
                ring.material.opacity = 0.3 * (1 - p);
                requestAnimationFrame(anim);
            })();
        }

        // --- 鼠标事件 ---
        let isMouseDown = false;

        function handlePointer(clientX, clientY) {
            const rect = renderer.domElement.getBoundingClientRect();
            const nx = (clientX - rect.left) / rect.width;
            const ny = 1 - (clientY - rect.top) / rect.height;
            if (nx < 0 || nx > 1 || ny < 0 || ny > 1) return;

            const ndcX = nx * 2 - 1;
            const ndcY = ny * 2 - 1;
            const raycaster = new THREE.Raycaster();
            raycaster.setFromCamera(new THREE.Vector2(ndcX, ndcY), camera);
            const groundPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
            const target = new THREE.Vector3();
            const point = raycaster.ray.intersectPlane(groundPlane, target);
            if (point && Math.abs(point.x) < 5.5 && Math.abs(point.z) < 5.5) {
                point.y = 0.02;
                plantFlowerAt(point);
            }
        }

        renderer.domElement.addEventListener('mousedown', (e) => {
            isMouseDown = true;
            handlePointer(e.clientX, e.clientY);
        });
        window.addEventListener('mousemove', (e) => {
            if (isMouseDown) {
                handlePointer(e.clientX, e.clientY);
            }
        });
        window.addEventListener('mouseup', () => { isMouseDown = false; });

        // --- 触摸事件 ---
        renderer.domElement.addEventListener('touchstart', (e) => {
            e.preventDefault();
            const t = e.touches[0];
            if (t) handlePointer(t.clientX, t.clientY);
        }, { passive: false });
        renderer.domElement.addEventListener('touchmove', (e) => {
            e.preventDefault();
            const t = e.touches[0];
            if (t) handlePointer(t.clientX, t.clientY);
        }, { passive: false });

        // --- 摄像头与手势 ---
        let hands = null;
        let video = null;
        let stream = null;
        let cameraActive = false;

        async function startCamera() {
            if (cameraActive) return;
            try {
                stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: "user", width: 320, height: 240 }
                });
                previewVideo.srcObject = stream;
                await previewVideo.play();

                video = document.createElement('video');
                video.style.display = 'none';
                video.srcObject = stream;
                await video.play();
                document.body.appendChild(video);

                hands = new Hands({ locateFile: (f) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}` });
                hands.setOptions({
                    maxNumHands: 1,
                    modelComplexity: 0,
                    minDetectionConfidence: 0.7,
                    minTrackingConfidence: 0.5
                });

                let prevWrist = null;
                let handDetected = false;

                hands.onResults((results) => {
                    if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                        handDetected = true;
                        debugEl.innerText = '✋ 手部已检测';
                        const lm = results.multiHandLandmarks[0];
                        const tips = [4, 8, 12, 16, 20];
                        const mcp = [2, 5, 9, 13, 17];
                        let open = true;
                        for (let i = 0; i < 5; i++) {
                            const t = lm[tips[i]];
                            const b = lm[mcp[i]];
                            const dist = Math.sqrt((t.x - b.x) ** 2 + (t.y - b.y) ** 2 + (t.z - b.z) ** 2);
                            if (dist < 0.03) { open = false; break; }
                        }
                        if (open) {
                            debugEl.innerText = '✋ 张开 · 滑动种花';
                            const wrist = lm[0];
                            const cur = new THREE.Vector2(wrist.x, wrist.y);
                            if (prevWrist && cur.distanceTo(prevWrist) > 0.015) {
                                // 手势种花
                                const nx = wrist.x;
                                const ny = wrist.y;
                                const ndcX = nx * 2 - 1;
                                const ndcY = ny * 2 - 1;
                                const raycaster = new THREE.Raycaster();
                                raycaster.setFromCamera(new THREE.Vector2(ndcX, -ndcY), camera);
                                const groundPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
                                const target = new THREE.Vector3();
                                const point = raycaster.ray.intersectPlane(groundPlane, target);
                                if (point && Math.abs(point.x) < 5.5 && Math.abs(point.z) < 5.5) {
                                    point.y = 0.02;
                                    plantFlowerAt(point);
                                }
                            }
                            prevWrist = cur;
                        } else {
                            debugEl.innerText = '✋ 握拳，请张开';
                            prevWrist = null;
                        }
                    } else {
                        if (handDetected) debugEl.innerText = '👋 手部丢失';
                        else debugEl.innerText = '⏳ 等待手部...';
                        prevWrist = null;
                    }
                });

                async function processFrame() {
                    if (video && video.readyState >= 2 && hands) {
                        await hands.send({ image: video });
                    }
                    requestAnimationFrame(processFrame);
                }
                processFrame();

                cameraActive = true;
                camBtn.textContent = '📷 关闭摄像头';
                debugEl.innerText = '✅ 手势就绪，张开手掌或按住鼠标滑动种花';
                document.getElementById('camera-preview').style.display = 'block';

            } catch (err) {
                console.warn('摄像头启动失败', err);
                debugEl.innerText = '❌ 摄像头不可用，请使用鼠标';
                alert('摄像头启动失败，您仍可使用鼠标拖动种花。');
            }
        }

        function stopCamera() {
            if (!cameraActive) return;
            if (hands) { hands = null; }
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
                stream = null;
            }
            if (video) {
                video.srcObject = null;
                video = null;
            }
            previewVideo.srcObject = null;
            previewVideo.style.display = 'none';
            cameraActive = false;
            camBtn.textContent = '📷 开启摄像头';
            debugEl.innerText = '摄像头已关闭，可使用鼠标';
            document.getElementById('camera-preview').style.display = 'none';
        }

        camBtn.addEventListener('click', () => {
            if (cameraActive) {
                stopCamera();
            } else {
                startCamera();
            }
        });

        window.addEventListener('beforeunload', () => {
            stopCamera();
        });

        // --- 主循环 ---
        const clock = new THREE.Clock();

        function animate() {
            const time = clock.getElapsedTime();

            grassGroup.children.forEach((blade) => {
                if (blade.isMesh) {
                    const windX = Math.sin(time * 1.8 + blade.position.x * 2.5 + blade.position.z * 1.5) * 0.04;
                    const windZ = Math.cos(time * 1.4 + blade.position.z * 2.0 + blade.position.x * 1.8) * 0.03;
                    blade.rotation.x = blade.userData.baseRotX + windX;
                    blade.rotation.z = blade.userData.baseRotZ + windZ;
                }
            });

            for (const f of flowers) {
                if (f) {
                    const phase = f.userData.phase || 0;
                    const speed = f.userData.speed || 1;
                    f.rotation.z = Math.sin(time * speed + phase) * 0.02;
                    f.rotation.x = Math.sin(time * speed * 0.7 + phase) * 0.01;
                }
            }

            composer.render();
            requestAnimationFrame(animate);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
        });

        console.log("🌺 粉红彼岸花海 (手动模式，花朵缩小至0.007) 已启动");
    </script>
</body>
</html>
